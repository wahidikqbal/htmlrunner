name: Deploy HTML

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy
        run: |
          ssh root@172.21.21.108 << 'EOF'
            set -ex

            whoami
            pwd
            git config --global --add safe.directory /var/www/htmlrunner

            cd /var/www/htmlrunner

            git status
            git fetch origin
            git reset --hard origin/main
          EOF
